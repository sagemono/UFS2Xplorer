name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lukka/get-cmake@latest
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}\installed
          key: vcpkg-${{ runner.os }}-openssl-catch2-v1

      - name: Install OpenSSL + Catch2
        shell: pwsh
        run: & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl catch2 --triplet x64-windows

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/rel -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DPS3HDD_BUILD_UI=ON -DPS3HDD_BUILD_TESTS=ON `
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/rel

      - name: Test
        run: ctest --test-dir build/rel --output-on-failure

      - name: Package
        shell: pwsh
        run: .\package.ps1 -SkipBuild

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UFS2Xplorer-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = (Get-ChildItem dist -Include *.zip, *.sha256 -Recurse).FullName
          if (gh release view $tag 2>$null) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag --title "UFS2Xplorer $tag" --generate-notes $assets
          }